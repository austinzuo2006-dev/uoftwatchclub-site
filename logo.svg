<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="dial-svg">
  <defs><style>@import url("https://fonts.googleapis.com/css2?family=Michroma&amp;family=Space+Mono:wght@700&amp;display=swap");</style>
    <radialGradient id="l-face" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#121c2a"/><stop offset="1" stop-color="#0b121c"/>
    </radialGradient>
    <filter id="l-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
